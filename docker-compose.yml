services:
  db:
    image: postgres:16-alpine
    container_name: aroma_db
    environment:
      POSTGRES_DB: aroma_lane
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aroma_lane"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: aroma_server
    environment:
      PORT: 5000
      JWT_SECRET: change_this_secret
      DB_DIALECT: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: aroma_lane
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSL: "false"
      CACHE_ENABLED: "true"
      CACHE_TTL_MS: 60000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: aroma_client
    depends_on:
      - server
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  postgres_data:
